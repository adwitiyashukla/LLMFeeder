[project]
name = "footnote-verify"
version = "0.1.0"
description = "Catches AI hallucinations by checking every claim against your sources, with character-exact citations. Offline by default, no API key required."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adwitiya Shukla" }]
keywords = [
    "hallucination-detection",
    "attribution",
    "grounding",
    "rag",
    "provenance",
    "llm-evaluation",
    "fact-checking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/adwitiyashukla/footnote"
Repository = "https://github.com/adwitiyashukla/footnote"
Issues = "https://github.com/adwitiyashukla/footnote/issues"

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11"]
mcp = ["mcp>=1.2,<2"]
all = ["pdfplumber>=0.11", "mcp>=1.2,<2"]

[project.scripts]
footnote = "footnote.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footnote"]

[tool.hatch.build.targets.sdist]
include = ["src/footnote", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/footnote/report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/footnote"]

[[tool.mypy.overrides]]
module = ["pdfplumber", "mcp", "mcp.server.fastmcp"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/footnote"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "except ImportError",
    "except PackageNotFoundError",
    "def serve",
]
