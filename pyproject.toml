[project]
name = "footnote-verify"
version = "0.1.0"
description = "Footnote: check whether generated text is actually supported by your sources, claim by claim, with exact citations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adwitiya Shukla" }]
keywords = [
    "hallucination-detection",
    "attribution",
    "grounding",
    "rag",
    "provenance",
    "llm-evaluation",
    "fact-checking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/adwitiyashukla/footnote"
Repository = "https://github.com/adwitiyashukla/footnote"
Issues = "https://github.com/adwitiyashukla/footnote/issues"
Changelog = "https://github.com/adwitiyashukla/footnote/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# PDF sources. Everything else parses with the standard library only.
pdf = ["pdfplumber>=0.11"]
# Model Context Protocol server, so agents can verify their own output.
mcp = ["mcp>=1.2"]
# Convenience bundle.
all = ["pdfplumber>=0.11", "mcp>=1.2"]

[project.scripts]
footnote = "footnote.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footnote"]

[tool.hatch.build.targets.sdist]
include = ["src/footnote", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001 flags "ambiguous" Unicode characters in strings. The tokeniser and sentence
# splitter deliberately match curly quotation marks, because real text is full of
# them and a claim written with a typographic apostrophe has to tokenise the same way
# as one written with a straight apostrophe. The report also uses arrow glyphs.
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
# The report module embeds HTML and CSS template strings that exceed the line length.
"src/footnote/report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/footnote"]

[[tool.mypy.overrides]]
module = ["pdfplumber", "mcp", "mcp.server.fastmcp"]
ignore_missing_imports = true

# FastMCP's @tool() decorator is untyped, so strict mode reports every tool it
# registers as an untyped function. The tool bodies themselves are fully annotated
# and checked; only the decorator is opaque, so the error is suppressed here rather
# than weakening the annotations.
[[tool.mypy.overrides]]
module = ["footnote.mcp_server"]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/footnote"]

[tool.coverage.report]
show_missing = true
